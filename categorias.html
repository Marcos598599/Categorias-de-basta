<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoría Aleatoria</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #FFF8F0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  /* Fondo de gradiente pastel suave */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, #FFD6E8 0%, transparent 50%),
      radial-gradient(ellipse at 80% 10%, #D6EEFF 0%, transparent 45%),
      radial-gradient(ellipse at 70% 85%, #D6FFE8 0%, transparent 45%),
      radial-gradient(ellipse at 15% 80%, #FFE8D6 0%, transparent 45%),
      #FFF8F0;
    z-index: 0;
  }

  canvas#confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  .wrapper {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    padding: 24px;
  }

  .header {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #B589D6;
  }

  /* Tarjeta central */
  .card {
    background: white;
    border-radius: 24px;
    box-shadow:
      0 4px 6px rgba(0,0,0,0.04),
      0 12px 40px rgba(0,0,0,0.08);
    padding: 52px 64px;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 220px;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Borde superior de color */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #FF6B9D, #FF9F43, #48DBFB, #A29BFE, #FF6B9D);
    background-size: 200% 100%;
    animation: shimmer 4s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }

  .emoji-display {
    font-size: 3.5rem;
    line-height: 1;
    opacity: 0;
    transform: scale(0.5) rotate(-15deg);
    transition: opacity 0.4s ease, transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .emoji-display.visible {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  .category-display {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 7vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-align: center;
    opacity: 0;
    transition: opacity 0.15s ease;
    background: linear-gradient(135deg, #FF6B9D, #FF9F43);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .category-display.visible { opacity: 1; }

  /* El color del texto cambia con cada categoría */
  .category-display.c0 { background-image: linear-gradient(135deg, #FF6B9D, #FF9F43); }
  .category-display.c1 { background-image: linear-gradient(135deg, #48DBFB, #0BE881); }
  .category-display.c2 { background-image: linear-gradient(135deg, #A29BFE, #FD79A8); }
  .category-display.c3 { background-image: linear-gradient(135deg, #FDCB6E, #E17055); }
  .category-display.c4 { background-image: linear-gradient(135deg, #55EFC4, #00CEC9); }
  .category-display.c5 { background-image: linear-gradient(135deg, #FF7675, #A29BFE); }

  .hint {
    font-size: 0.7rem;
    color: #BDBDBD;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.5s ease 0.5s;
  }
  .hint.visible { opacity: 1; }

  /* Botón */
  button {
    position: relative;
    background: linear-gradient(135deg, #FF6B9D, #FF9F43);
    border: none;
    color: white;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 20px 56px;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(255, 107, 157, 0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    outline: none;
  }

  button:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 12px 32px rgba(255, 107, 157, 0.5);
  }
  button:active {
    transform: translateY(1px) scale(0.98);
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
  }

  /* Ripple al hacer click */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transform: scale(0);
    animation: ripple-anim 0.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple-anim {
    to { transform: scale(4); opacity: 0; }
  }

  .counter {
    font-size: 0.68rem;
    color: #C0C0C0;
    letter-spacing: 0.12em;
    margin-top: -28px;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .counter.visible { opacity: 1; }
</style>
</head>

let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playReveal() {
  try {
    const ctx = getAudio();
    const t = ctx.currentTime;
    [659, 784, 988].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t + i * 0.08);
      gain.gain.setValueAtTime(0, t + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.13, t + i * 0.08 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.5);
      osc.start(t + i * 0.08);
      osc.stop(t + i * 0.08 + 0.55);
    });
  } catch(e) {}
}

// ─── Confeti ─────────────────────────────────────────────
const confCanvas = document.getElementById('confetti');

confCanvas.width = window.innerWidth;
confCanvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  confCanvas.width = window.innerWidth;
  confCanvas.height = window.innerHeight;
});

const CONF_COLORS = ['#FF6B9D','#FF9F43','#48DBFB','#A29BFE','#0BE881','#FDCB6E','#FF7675','#55EFC4','#FD79A8','#74B9FF'];

let pieces = [];
let confRaf = null;

function spawnConfetti() {
  const cx = window.innerWidth / 2;
  // Lanzar 120 piezas desde el centro
  for (let i = 0; i < 120; i++) {
    const angle = (Math.random() * 360) * Math.PI / 180;
    const speed = Math.random() * 12 + 4;
    pieces.push({
      x: cx,
      y: window.innerHeight * 0.42, // desde la tarjeta
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 6,
      r: Math.random() * 7 + 3,
      color: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)],
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 10,
      shape: Math.random() < 0.5 ? 'rect' : 'circle',
      life: 1,
      w: Math.random() * 10 + 5,
      h: Math.random() * 5 + 3,
    });
  }
  if (!confRaf) animateConfetti();
}

function animateConfetti() {
  confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  let alive = false;
  pieces.forEach(p => {
    p.vy += 0.35; // gravedad
    p.vx *= 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.rotV;
    p.life -= 0.012;
    if (p.life <= 0 || p.y > confCanvas.height + 20) return;
    alive = true;
    confCtx.save();
    confCtx.globalAlpha = Math.max(0, p.life);
    confCtx.translate(p.x, p.y);
    confCtx.rotate(p.rot * Math.PI / 180);
    confCtx.fillStyle = p.color;
    if (p.shape === 'circle') {
      confCtx.beginPath();
      confCtx.arc(0, 0, p.r, 0, Math.PI * 2);
      confCtx.fill();
    } else {
      confCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    }
    confCtx.restore();
  });
  pieces = pieces.filter(p => p.life > 0 && p.y < confCanvas.height + 20);
  if (pieces.length > 0) {
    confRaf = requestAnimationFrame(animateConfetti);
  } else {
    confRaf = null;
    confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  }
}

// ─── Ripple en botón ─────────────────────────────────────
function addRipple(e) {
  const btn = e.currentTarget || document.getElementById('btn');
  const rect = btn.getBoundingClientRect();
  const x = (e.clientX || rect.left + rect.width/2) - rect.left;
  const y = (e.clientY || rect.top + rect.height/2) - rect.top;
  const rip = document.createElement('span');
  rip.className = 'ripple';
  rip.style.cssText = `left:${x}px;top:${y}px;width:${rect.width}px;height:${rect.width}px;margin-left:-${rect.width/2}px;margin-top:-${rect.width/2}px`;
  btn.appendChild(rip);
  setTimeout(() => rip.remove(), 600);
}

// ─── Lógica principal ────────────────────────────────────
function newCategory(e) {
  if (e) addRipple(e);

  let idx;
  do { idx = Math.floor(Math.random() * CATEGORIES.length); } while (idx === lastIdx);
  lastIdx = idx;
  count++;

  const { name, emoji } = CATEGORIES[idx];
  const catEl  = document.getElementById('cat');
  const emojiEl = document.getElementById('emoji');
  const hintEl  = document.getElementById('hint');
  const counterEl = document.getElementById('counter');

  // Reset
  catEl.classList.remove('visible');
  emojiEl.classList.remove('visible');
  hintEl.classList.remove('visible');

  // Rotar color de gradiente
  const colorClass = 'c' + (colorIdx % 6);
  colorIdx++;
  catEl.className = 'category-display ' + colorClass;

  if (rafId) cancelAnimationFrame(rafId);
  const duration = 480;
  const start = performance.now();
  const len = name.length;

  function scramble(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const fixed = Math.floor(progress * len);
    let display = '';
    for (let i = 0; i < len; i++) {
      if (i < fixed) display += name[i];
      else display += name[i] === ' ' ? ' ' : CHARS[Math.floor(Math.random() * CHARS.length)];
    }
    catEl.textContent = display;
    catEl.classList.add('visible');

    if (progress < 1) {
      rafId = requestAnimationFrame(scramble);
    } else {
      catEl.textContent = name;
      emojiEl.textContent = emoji;
      emojiEl.classList.add('visible');
      hintEl.classList.add('visible');
      counterEl.textContent = `${count} generada${count !== 1 ? 's' : ''} · ${CATEGORIES.length} categorías en total`;
      counterEl.classList.add('visible');
      playReveal();
      spawnConfetti();
    }
  }
  rafId = requestAnimationFrame(scramble);
}

// Vincular ripple al botón también en touch
document.getElementById('btn').addEventListener('click', e => addRipple(e));
</script>
